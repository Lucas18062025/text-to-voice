services:
  - type: web
    name: text-to-voice-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: TTS_PROVIDER
        value: edge
      - key: PYTHON_VERSION
        value: "3.12.8"
