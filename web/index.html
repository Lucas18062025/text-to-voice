<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Texto a audio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c6bff'/%3E%3Cpath d='M12 20V12l8-2v8' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='10.5' cy='21' r='2.5' fill='white'/%3E%3Ccircle cx='18.5' cy='19' r='2.5' fill='white'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0a0c11;
    --panel:#11151d;
    --panel-2:#161b25;
    --line:#232b3a;
    --text:#e8ecf5;
    --muted:#8e9ab2;
    --accent:#7c6bff;
    --accent-2:#4cc9f0;
    --danger:#ff7373;
    --ok:#4ade80;
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(124,107,255,.16), transparent 60%),
      radial-gradient(800px 500px at 110% 10%, rgba(76,201,240,.10), transparent 55%),
      var(--bg);
    color:var(--text);
    font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .shell{max-width:720px;margin:0 auto;padding:56px 20px 96px}
  header{margin-bottom:26px}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin-bottom:12px;
  }
  .eyebrow::before{
    content:"";width:7px;height:7px;border-radius:50%;
    background:var(--ok);box-shadow:0 0 0 4px rgba(74,222,128,.14);
  }
  h1{margin:0 0 8px;font-size:clamp(28px,5vw,38px);line-height:1.1;letter-spacing:-.025em;font-weight:650}
  .sub{margin:0;color:var(--muted)}
  .pill{
    display:inline-block;margin-top:14px;padding:4px 10px;border-radius:999px;
    border:1px solid var(--line);background:rgba(255,255,255,.03);
    font-size:12px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  form{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;box-shadow:0 24px 60px -30px rgba(0,0,0,.9);
  }
  .field{display:block;position:relative;margin:0 0 18px}
  .label{
    display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    font-size:13px;font-weight:600;color:#c3cbdc;margin-bottom:8px;
  }
  textarea,select{
    width:100%;font:inherit;color:var(--text);
    background:var(--panel-2);border:1px solid var(--line);border-radius:12px;
    padding:13px 14px;outline:none;transition:border-color .15s,box-shadow .15s;
  }
  textarea{min-height:168px;resize:vertical;line-height:1.6}
  textarea::placeholder{color:#64708a}
  textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,107,255,.18)}
  .counter{
    position:absolute;right:10px;bottom:9px;font-size:11px;color:#5f6b84;
    font-variant-numeric:tabular-nums;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(22,27,37,.9) 28%);padding:2px 4px 2px 18px;border-radius:6px;
  }
  .counter.over{color:var(--danger)}
  .grid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px}
  select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%238e9ab2' stroke-width='1.6' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:36px;cursor:pointer}
  output{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
  input[type=range]{width:100%;accent-color:var(--accent);background:transparent;height:38px;margin:0}
  .primary{
    display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;margin-top:4px;padding:14px 18px;border:0;border-radius:12px;cursor:pointer;
    font:inherit;font-weight:650;color:#fff;
    background:linear-gradient(135deg,var(--accent),#5b8cff 55%,var(--accent-2));
    box-shadow:0 12px 28px -14px rgba(124,107,255,.9);
    transition:transform .12s,filter .15s,opacity .15s;
  }
  .primary:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.06)}
  .primary:active:not(:disabled){transform:translateY(0)}
  .primary:disabled{opacity:.55;cursor:progress}
  .player{
    margin-top:20px;padding:16px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--panel);
  }
  audio{width:100%;height:42px;border-radius:10px}
  .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;font-size:13px;color:var(--muted)}
  .ghost{
    display:inline-flex;align-items:center;gap:7px;
    text-decoration:none;color:var(--text);border:1px solid var(--line);
    padding:7px 12px;border-radius:9px;font-weight:600;font-size:13px;white-space:nowrap;
    transition:background .15s,border-color .15s;
  }
  .ghost:hover{background:rgba(255,255,255,.05);border-color:#33405a}
  .status{min-height:22px;margin:16px 2px 0;font-size:13.5px;color:var(--muted)}
  .status.error{color:var(--danger)}
  .status.ok{color:var(--ok)}
  .hint{margin-top:18px;font-size:12.5px;color:#5f6b84;text-align:center}
  .icon{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .icon.solid{fill:currentColor;stroke:none}
  .ghost .icon{width:15px;height:15px;color:var(--muted)}
  .social{display:flex;justify-content:center;gap:10px;margin-top:20px}
  .ic{
    display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
    border:1px solid var(--line);border-radius:10px;color:var(--muted);
    background:rgba(255,255,255,.02);
    transition:color .15s,border-color .15s,background .15s,transform .12s;
  }
  .ic:hover{color:var(--text);border-color:#33405a;background:rgba(255,255,255,.06);transform:translateY(-1px)}
  .ic:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .ic svg{width:16px;height:16px}
  kbd{font:inherit;font-size:11.5px;padding:1px 5px;border:1px solid var(--line);border-radius:5px;background:rgba(255,255,255,.04)}
  @media (max-width:560px){
    .shell{padding:36px 16px 72px}
    form{padding:18px}
    .grid{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<main class="shell">
  <header>
    <div class="eyebrow">Texto → voz</div>
    <h1>Texto a audio</h1>
    <p class="sub">Escribí o pegá el texto, elegí una voz y escuchá el resultado.</p>
    <span class="pill" id="provider">cargando motor…</span>
  </header>

  <form id="form" novalidate>
    <label class="field">
      <span class="label">Texto</span>
      <textarea id="text" rows="7" placeholder="Pegá o escribí el texto que querés escuchar…" spellcheck="false"></textarea>
      <span class="counter" id="counter">0 / 3000</span>
    </label>

    <div class="grid">
      <label class="field" style="margin-bottom:0">
        <span class="label">Voz</span>
        <select id="voice"></select>
      </label>
      <label class="field" style="margin-bottom:0">
        <span class="label">Velocidad <output id="rateOut">1.00×</output></span>
        <input type="range" id="rate" min="75" max="150" step="5" value="100">
      </label>
    </div>

    <button id="go" class="primary" type="submit">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.2 6a9 9 0 0 1 0 12"/></svg>
      <span id="goLabel">Generar audio</span>
    </button>
  </form>

  <section class="player" id="player" hidden>
    <audio id="audio" controls preload="metadata"></audio>
    <div class="meta">
      <span id="metaText"></span>
      <a id="download" class="ghost" download="audio.mp3">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M4 20h16"/></svg>
        <span>Descargar MP3</span>
      </a>
    </div>
  </section>

  <p class="status" id="status" role="status" aria-live="polite"></p>
  <p class="hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> para generar</p>

  <footer class="social">
    <a class="ic" href="https://github.com/Lucas18062025" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
      <svg viewBox="0 0 24 24" class="icon solid" aria-hidden="true"><path d="M12 .5C5.73.5.99 5.24.99 11.5c0 4.86 3.15 8.98 7.52 10.44.55.1.75-.24.75-.53v-1.86c-3.06.67-3.71-1.47-3.71-1.47-.5-1.28-1.22-1.62-1.22-1.62-1-.68.08-.67.08-.67 1.1.08 1.68 1.13 1.68 1.13.98 1.68 2.57 1.2 3.2.92.1-.71.38-1.2.7-1.47-2.44-.28-5.01-1.22-5.01-5.44 0-1.2.43-2.18 1.13-2.95-.11-.28-.49-1.4.11-2.92 0 0 .92-.29 3.01 1.12a10.4 10.4 0 0 1 5.48 0c2.09-1.41 3.01-1.12 3.01-1.12.6 1.52.22 2.64.11 2.92.7.77 1.13 1.75 1.13 2.95 0 4.23-2.58 5.16-5.03 5.43.4.34.75 1.01.75 2.04v3.03c0 .29.2.64.76.53a11.01 11.01 0 0 0 7.51-10.44C23.01 5.24 18.27.5 12 .5z"/></svg>
    </a>
    <a class="ic" href="https://portafolio.lucaslean1806.workers.dev/" target="_blank" rel="noopener noreferrer" aria-label="Portafolio" title="Portafolio">
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.4 2.6 3.8 5.6 3.8 9S14.4 18.4 12 21c-2.4-2.6-3.8-5.6-3.8-9S9.6 5.6 12 3z"/></svg>
    </a>
    <a class="ic" href="https://www.linkedin.com/in/lucas-villagra-cybersecurity/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn">
      <svg viewBox="0 0 24 24" class="icon solid" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zM7.12 20.45H3.55V9h3.57v11.45z"/></svg>
    </a>
  </footer>
</main>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const form = $("form");
  const textEl = $("text");
  const counter = $("counter");
  const voiceEl = $("voice");
  const rateEl = $("rate");
  const rateOut = $("rateOut");
  const go = $("go");
  const goLabel = $("goLabel");
  const player = $("player");
  const audio = $("audio");
  const download = $("download");
  const metaText = $("metaText");
  const status = $("status");
  const providerPill = $("provider");

  let maxChars = 3000;
  let objectUrl = null;

  const setStatus = (message, kind = "") => {
    status.textContent = message;
    status.className = "status" + (kind ? " " + kind : "");
  };

  const updateCounter = () => {
    const n = textEl.value.length;
    counter.textContent = `${n} / ${maxChars}`;
    counter.classList.toggle("over", n > maxChars);
  };

  const detailOf = async (response) => {
    try {
      const body = await response.json();
      if (typeof body.detail === "string") return body.detail;
      if (Array.isArray(body.detail)) return body.detail.map((d) => d.msg).join("; ");
    } catch { /* respuesta sin JSON */ }
    return `Error ${response.status}`;
  };

  const buildVoices = (voices) => {
    voiceEl.innerHTML = "";
    const groups = [
      ["F", "Voces femeninas"],
      ["M", "Voces masculinas"],
    ];
    for (const [gender, label] of groups) {
      const group = voices.filter((v) => v.gender === gender);
      if (!group.length) continue;
      const optgroup = document.createElement("optgroup");
      optgroup.label = label;
      for (const voice of group) {
        const option = document.createElement("option");
        option.value = voice.id;
        option.textContent = `${voice.name} — ${voice.country} (${voice.locale})`;
        optgroup.appendChild(option);
      }
      voiceEl.appendChild(optgroup);
    }
    const preferred = voices.find((v) => v.id === "es-AR-ElenaNeural")
      || voices.find((v) => v.gender === "F")
      || voices[0];
    if (preferred) voiceEl.value = preferred.id;
  };

  const loadVoices = async () => {
    try {
      const response = await fetch("/api/voices");
      if (!response.ok) throw new Error(await detailOf(response));
      const data = await response.json();
      maxChars = data.max_chars;
      textEl.maxLength = maxChars;
      providerPill.textContent = `motor: ${data.provider}`;
      buildVoices(data.voices);
      updateCounter();
      setStatus("");
    } catch (error) {
      providerPill.textContent = "motor: sin conexión";
      setStatus(`No pude cargar las voces: ${error.message}`, "error");
    }
  };

  const stamp = () => {
    const d = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    return `${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  };

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const text = textEl.value.trim();
    if (!text) { setStatus("Escribí algo de texto primero.", "error"); textEl.focus(); return; }
    if (textEl.value.length > maxChars) { setStatus(`El texto supera los ${maxChars} caracteres.`, "error"); return; }

    player.hidden = true;
    go.disabled = true;
    const original = goLabel.textContent;
    goLabel.textContent = "Generando…";
    setStatus("Sintetizando…");

    try {
      const response = await fetch("/api/tts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          text,
          voice: voiceEl.value,
          rate: Number(rateEl.value),
        }),
      });
      if (!response.ok) throw new Error(await detailOf(response));

      const blob = await response.blob();
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(blob);

      audio.src = objectUrl;
      const filename = `texto-a-audio-${voiceEl.value.replace(/[^\w-]/g, "")}-${stamp()}.mp3`;
      download.href = objectUrl;
      download.download = filename;
      metaText.textContent = `${(blob.size / 1024).toFixed(0)} KB · ${voiceEl.options[voiceEl.selectedIndex]?.textContent ?? ""}`;

      player.hidden = false;
      player.scrollIntoView({ behavior: "smooth", block: "nearest" });
      await audio.play().catch(() => {});
      setStatus("Listo. Escuchá o descargá el MP3.", "ok");
    } catch (error) {
      setStatus(error.message, "error");
    } finally {
      go.disabled = false;
      goLabel.textContent = original;
    }
  });

  textEl.addEventListener("input", updateCounter);
  textEl.addEventListener("keydown", (event) => {
    if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
      event.preventDefault();
      form.requestSubmit();
    }
  });

  rateEl.addEventListener("input", () => {
    rateOut.textContent = `${(Number(rateEl.value) / 100).toFixed(2)}×`;
  });

  loadVoices();
})();
</script>
</body>
</html>
