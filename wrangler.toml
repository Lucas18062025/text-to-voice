name = "text-to-voice"
main = "worker.js"
compatibility_date = "2026-11-01"

# La UI se sirve desde ./web como assets estáticos.
[assets]
directory = "./web"
binding = "ASSETS"

# Backend Python que ejecuta la sintesis (edge-tts): Render, Fly, Koyeb
# o un tunel de cloudflared. Vacio = el Worker responde un 500 con mensaje
# claro en /api/* en vez de colgarse esperando un host inexistente.
# Se setea al deployar, sin modificar este archivo:
#   .\deploy-cloudflare.ps1 -ApiOrigin https://tu-backend
[vars]
API_ORIGIN = ""

# Mantiene despierto el backend de free tier.
[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
