name = "text-to-voice"
main = "worker.js"
compatibility_date = "2026-11-01"

# La UI se sirve desde ./web como assets estáticos.
[assets]
directory = "./web"
binding = "ASSETS"

# Backend Python que ejecuta la sintesis (edge-tts): Render, Fly, Koyeb
# o un tunel de cloudflared.
#
# El default es el backend de produccion, para que `wrangler deploy` a
# secas NO deje el Worker sin origen (sintoma anterior: 503 en todo /api/*).
# Se puede pisar sin tocar el archivo:
#   .\deploy-cloudflare.ps1 -ApiOrigin https://otro-backend
#
# API_ORIGIN es una URL publica, no un secreto: va en el repo a proposito.
[vars]
API_ORIGIN = "https://text-to-voice-api-ila7.onrender.com"

# Mantiene despierto el backend de free tier.
[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
